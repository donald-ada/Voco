name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Prepare SherpaOnnx runtime
        run: native/scripts/ensure_sherpa_onnx_runtime.sh
      - name: Swift build
        run: swift build --package-path native
      - name: Swift test
        run: swift test --package-path native
      - name: Native app bundle smoke
        run: packaging/tests/native_app_bundle_smoke.sh
