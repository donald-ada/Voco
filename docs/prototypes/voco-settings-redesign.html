<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voco 设置</title>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --page: #ecebea;
    --window: #f8f8f6;
    --window-2: #f1f1ee;
    --fg: #161716;
    --muted: #666a64;
    --quiet: #8a8e87;
    --line: rgba(22, 23, 22, 0.11);
    --line-strong: rgba(22, 23, 22, 0.18);
    --accent: #21b66f;
    --accent-ink: #05391f;
    --accent-soft: #dff7eb;
    --warning: #b7791f;
    --warning-soft: #fff0d1;
    --danger: #c7352e;
    --danger-soft: #ffe2df;
    --blue: #2c6dd2;
    --blue-soft: #e4eefc;
    --black: #050505;
    --white: #ffffff;
    --font-body: "IBM Plex Sans", sans-serif;
    --font-mono: "IBM Plex Mono", monospace;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body,
  #root {
    min-height: 100%;
  }

  body {
    margin: 0;
    background: var(--page);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  button,
  input,
  select {
    font-family: var(--font-body);
  }

  button {
    cursor: pointer;
  }

  h1,
  h2,
  h3,
  p {
    margin: 0;
    letter-spacing: 0;
  }

  p,
  h1,
  h2,
  h3 {
    text-wrap: pretty;
  }

  .page {
    min-height: 100vh;
    padding: 26px;
  }

  .shellTop {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    max-width: 1240px;
    margin: 0 auto 18px;
  }

  .brandLockup {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .appMark {
    width: 34px;
    height: 34px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    display: grid;
    place-items: center;
    background: var(--black);
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
  }

  .brandText {
    min-width: 0;
  }

  .brandText strong {
    display: block;
    font-size: 14px;
  }

  .brandText span {
    display: block;
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .variantSwitch {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.54);
  }

  .variantSwitch button {
    min-height: 34px;
    padding: 7px 13px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
  }

  .variantSwitch button.active {
    background: var(--fg);
    color: var(--white);
  }

  .prototypeToast {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 30;
    padding: 10px 13px;
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.94);
    box-shadow: 0 16px 40px rgba(22, 23, 22, 0.16);
    color: var(--fg);
    font-size: 13px;
    font-weight: 700;
  }

  .window {
    max-width: 1240px;
    min-height: 720px;
    margin: 0 auto;
    border: 1px solid var(--line-strong);
    border-radius: 14px;
    background: var(--window);
    box-shadow: 0 26px 70px rgba(22, 23, 22, 0.16);
    overflow: hidden;
  }

  .titlebar {
    height: 42px;
    border-bottom: 1px solid var(--line);
    background: rgba(241, 241, 238, 0.92);
    display: grid;
    grid-template-columns: 96px 1fr 190px;
    align-items: center;
    padding: 0 14px;
  }

  .traffic {
    display: flex;
    gap: 8px;
  }

  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 1px solid rgba(0, 0, 0, 0.12);
  }

  .dot.red { background: #ff6159; }
  .dot.yellow { background: #ffbd2e; }
  .dot.green { background: #28c840; }

  .windowTitle {
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: #3b3d39;
  }

  .statusMini {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    color: var(--muted);
    font-size: 12px;
  }

  .statusDot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: var(--accent);
  }

  .layout {
    display: grid;
    grid-template-columns: 250px 1fr;
    min-height: 678px;
  }

  .sidebar {
    border-right: 1px solid var(--line);
    background: #efefec;
    padding: 14px 10px;
  }

  .sidebarChrome {
    height: 30px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    margin-bottom: 8px;
  }

  .sidebarHeader {
    padding: 10px 12px 12px;
  }

  .sidebarHeader strong {
    display: block;
    font-size: 12px;
    color: var(--muted);
    font-family: var(--font-mono);
    font-weight: 600;
  }

  .sidebarHeader span {
    display: block;
    margin-top: 5px;
    font-size: 13px;
    color: var(--fg);
    font-weight: 600;
  }

  .navBtn {
    width: 100%;
    min-height: 48px;
    display: grid;
    grid-template-columns: 18px 1fr;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--fg);
    text-align: left;
  }

  .navBtn:hover {
    background: rgba(22, 23, 22, 0.05);
  }

  .navBtn.active {
    background: rgba(255, 255, 255, 0.82);
    box-shadow: inset 0 0 0 1px var(--line);
  }

  .navCopy strong {
    display: block;
    font-size: 13px;
  }

  .navCopy span {
    display: block;
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .statePoint {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: var(--quiet);
    box-shadow: 0 0 0 4px rgba(138, 142, 135, 0.12);
    justify-self: center;
  }

  .statePoint.ok {
    background: var(--accent);
    box-shadow: 0 0 0 4px rgba(33, 182, 111, 0.12);
  }

  .statePoint.warn {
    background: var(--warning);
    box-shadow: 0 0 0 4px rgba(183, 121, 31, 0.12);
  }

  .statePoint.bad {
    background: var(--danger);
    box-shadow: 0 0 0 4px rgba(199, 53, 46, 0.12);
  }

  .content {
    padding: 26px;
    overflow: auto;
  }

  .contentHeader {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 22px;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    font-weight: 600;
  }

  .contentHeader h1 {
    margin-top: 5px;
    font-size: 30px;
    line-height: 1.14;
  }

  .contentHeader p {
    margin-top: 8px;
    color: var(--muted);
    max-width: 660px;
  }

  .buttonRow {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .btn {
    min-height: 36px;
    border-radius: 8px;
    border: 1px solid var(--line);
    padding: 0 12px;
    background: rgba(255, 255, 255, 0.72);
    color: var(--fg);
    font-weight: 600;
    font-size: 13px;
  }

  .btn.primary {
    background: var(--fg);
    color: var(--white);
    border-color: var(--fg);
  }

  .btn.accent {
    background: var(--accent-soft);
    color: var(--accent-ink);
    border-color: rgba(33, 182, 111, 0.22);
  }

  .btn.danger {
    background: #ffffff;
    color: var(--danger);
  }

  .grid2 {
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 16px;
  }

  .grid3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }

  .grid4 {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
  }

  .panel {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #ffffff;
  }

  .panelHeader {
    min-height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 13px 15px;
    border-bottom: 1px solid var(--line);
  }

  .panelHeader h2,
  .panelHeader h3 {
    font-size: 16px;
  }

  .panelHeader p {
    margin-top: 3px;
    color: var(--muted);
    font-size: 12px;
  }

  .panelBody {
    padding: 14px 15px;
  }

  .panelBody.tight {
    padding: 0;
  }

  .row {
    display: grid;
    grid-template-columns: 30px 1fr auto;
    gap: 10px;
    align-items: center;
    min-height: 54px;
    padding: 10px 15px;
    border-bottom: 1px solid var(--line);
  }

  .row:last-child {
    border-bottom: 0;
  }

  .row.main {
    min-height: 66px;
  }

  .rowCopy strong {
    display: block;
    font-size: 14px;
  }

  .rowCopy span {
    display: block;
    margin-top: 2px;
    color: var(--muted);
    font-size: 12px;
  }

  .sym {
    width: 26px;
    height: 26px;
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 600;
    background: var(--window-2);
  }

  .sym.ok {
    background: var(--accent-soft);
    border-color: rgba(33, 182, 111, 0.28);
    color: var(--accent-ink);
  }

  .sym.warn {
    background: var(--warning-soft);
    border-color: rgba(183, 121, 31, 0.26);
    color: var(--warning);
  }

  .sym.bad {
    background: var(--danger-soft);
    border-color: rgba(199, 53, 46, 0.28);
    color: var(--danger);
  }

  .pill {
    min-height: 24px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 999px;
    padding: 3px 9px;
    border: 1px solid var(--line);
    background: var(--window-2);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }

  .pill.ok {
    background: var(--accent-soft);
    color: var(--accent-ink);
    border-color: rgba(33, 182, 111, 0.24);
  }

  .pill.warn {
    background: var(--warning-soft);
    color: var(--warning);
    border-color: rgba(183, 121, 31, 0.22);
  }

  .pill.bad {
    background: var(--danger-soft);
    color: var(--danger);
    border-color: rgba(199, 53, 46, 0.22);
  }

  .heroStatus {
    min-height: 246px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 370px;
    gap: 20px;
    padding: 20px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #ffffff;
    align-items: stretch;
  }

  .heroStatus h2 {
    font-size: 24px;
    line-height: 1.18;
  }

  .heroStatus p {
    color: var(--muted);
    margin-top: 8px;
  }

  .commandKey {
    min-width: 118px;
    height: 72px;
    border-radius: 10px;
    border: 1px solid var(--line-strong);
    background: var(--window-2);
    display: grid;
    place-items: center;
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 600;
  }

  .voiceFlow {
    min-height: 268px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #f6f6f3;
    padding: 14px;
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 12px;
  }

  .voiceFlowHeader {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
  }

  .voiceFlowGrid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    align-items: center;
  }

  .flowCard {
    min-height: 58px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.82);
    padding: 10px;
    display: grid;
    align-content: center;
    justify-items: center;
    text-align: center;
    gap: 6px;
  }

  .flowCard strong {
    font-size: 13px;
  }

  .flowCard span {
    color: var(--muted);
    font-size: 11px;
  }

  .flowArrow {
    color: var(--quiet);
    font-family: var(--font-mono);
    font-size: 0;
    height: 10px;
    position: relative;
    text-align: center;
    line-height: 1;
  }

  .flowArrow::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 0;
    width: 1px;
    height: 10px;
    background: var(--line-strong);
  }

  .miniNotch {
    width: 100%;
    min-height: 78px;
    border-radius: 24px;
    background: #000000;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
    padding: 12px 15px;
    color: #ffffff;
  }

  .miniNotch .notchText {
    font-size: 12px;
  }

  .inputMock {
    width: 100%;
    min-height: 62px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.82);
    padding: 10px;
  }

  .inputMock strong {
    display: block;
    font-size: 13px;
  }

  .inputLine {
    height: 8px;
    border-radius: 999px;
    background: var(--window-2);
    margin-top: 10px;
  }

  .inputLine.short {
    width: 64%;
  }

  .inputLine.long {
    width: 88%;
  }

  .chainStep {
    min-height: 138px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #ffffff;
    padding: 13px;
    display: grid;
    align-content: space-between;
    gap: 12px;
  }

  .chainStepTop {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  .chainStep strong {
    display: block;
    margin-top: 8px;
    font-size: 15px;
  }

  .chainStep p {
    margin-top: 4px;
    color: var(--muted);
    font-size: 12px;
  }

  .hudPreview {
    min-height: 128px;
    border-radius: 10px;
    background: #1b1b1b;
    padding: 18px;
    display: grid;
    place-items: center;
    color: #ffffff;
  }

  .notch {
    width: min(100%, 330px);
    min-height: 76px;
    border-radius: 28px;
    background: #000000;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.42);
    padding: 13px 18px;
  }

  .notchTop {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .notchLabel {
    color: #ffcc4d;
    font-size: 13px;
    font-weight: 700;
  }

  .wave {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 24px;
  }

  .wave span {
    width: 3px;
    border-radius: 999px;
    background: #32d67a;
  }

  .wave span:nth-child(1) { height: 12px; }
  .wave span:nth-child(2) { height: 19px; }
  .wave span:nth-child(3) { height: 24px; }
  .wave span:nth-child(4) { height: 17px; }
  .wave span:nth-child(5) { height: 13px; }
  .wave span:nth-child(6) { height: 20px; }
  .wave span:nth-child(7) { height: 14px; }

  .notchText {
    margin-top: 7px;
    color: #8dffb5;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.25;
  }

  .formGrid {
    display: grid;
    gap: 10px;
  }

  .fieldLabel {
    display: block;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .input,
  .select {
    width: 100%;
    min-height: 38px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: #ffffff;
    color: var(--fg);
    padding: 0 10px;
    font-size: 13px;
  }

  .segmented {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--window-2);
  }

  .segmented button {
    min-height: 34px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
  }

  .segmented button.active {
    background: #ffffff;
    color: var(--fg);
    box-shadow: inset 0 0 0 1px var(--line);
  }

  .meter {
    height: 8px;
    border-radius: 999px;
    background: var(--window-2);
    overflow: hidden;
  }

  .meter span {
    display: block;
    height: 100%;
    width: 67%;
    background: var(--accent);
    border-radius: inherit;
  }

  .menuMock {
    width: 226px;
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.96);
    box-shadow: 0 18px 44px rgba(22, 23, 22, 0.18);
    padding: 6px;
  }

  .menuItem {
    min-height: 30px;
    display: grid;
    grid-template-columns: 24px 1fr auto;
    align-items: center;
    gap: 8px;
    padding: 4px 8px;
    border-radius: 6px;
    color: var(--fg);
    font-size: 13px;
  }

  .menuItem.active {
    background: var(--blue-soft);
    color: var(--blue);
  }

  .menuItem.disabled {
    color: var(--quiet);
  }

  .menuDivider {
    height: 1px;
    background: var(--line);
    margin: 5px 8px;
  }

  .prefLayout {
    padding: 18px;
  }

  .toolbarTabs {
    display: flex;
    gap: 6px;
    padding: 6px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--window-2);
    margin-bottom: 18px;
  }

  .toolbarTabs button {
    min-height: 40px;
    flex: 1;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
  }

  .toolbarTabs button.active {
    background: #ffffff;
    color: var(--fg);
    box-shadow: inset 0 0 0 1px var(--line);
  }

  .compactHero {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 16px;
  }

  .topStrip {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }

  .stat {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #ffffff;
    padding: 13px;
  }

  .stat span {
    display: block;
    color: var(--muted);
    font-size: 12px;
  }

  .stat strong {
    display: block;
    margin-top: 6px;
    font-size: 18px;
  }

  .wizard {
    display: grid;
    grid-template-columns: 330px 1fr;
    min-height: 678px;
  }

  .wizardRail {
    background: #111211;
    color: #f8f8f6;
    padding: 22px;
  }

  .wizardRail h1 {
    font-size: 29px;
    line-height: 1.16;
  }

  .wizardRail p {
    margin-top: 10px;
    color: rgba(248, 248, 246, 0.68);
  }

  .stepBtn {
    width: 100%;
    min-height: 68px;
    display: grid;
    grid-template-columns: 32px 1fr;
    gap: 11px;
    align-items: center;
    margin-top: 10px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 10px;
    background: transparent;
    color: #f8f8f6;
    text-align: left;
    padding: 10px;
  }

  .stepBtn.active {

                  <div className="buttonRow">
                    <Button tone="primary">打开辅助功能设置</Button>
                    <Button>开始测试录音</Button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {tab === "voice" && <VoiceSettingsPanel />}
          {tab === "transcription" && (
            <div className="grid2">
              <CredentialPanel />
              <div className="panel">
                <div className="panelHeader">
                  <div>
                    <h3>连接测试</h3>
                    <p>保存凭证后直接验证 Doubao 是否可用</p>
                  </div>
                  <Pill tone="ok">最近测试通过</Pill>
                </div>
                <div className="panelBody formGrid">
                  <div className="row" style={{ paddingLeft: 0, paddingRight: 0 }}>
                    <SymbolBox label="hdr" tone="ok" />
                    <span className="rowCopy">
                      <strong>Header 模式</strong>
                      <span>Authorization: Bearer · 新网关 API Key</span>
                    </span>
                    <Button>查看</Button>
                  </div>
                  <Button tone="accent">测试连接</Button>
                </div>
              </div>
            </div>
          )}
          {tab === "permissions" && <PermissionRows />}
          {tab === "diagnostics" && <DiagnosticsPanel />}
        </main>
      </div>
    );
  }

  function RecoveryVariant() {
    const [step, setStep] = useState("command");
    const activeIndex = wizardSteps.findIndex((item) => item.id === step);

    return (
      <div className="window">
        <Titlebar title="Voco 语音输入修复向导" />
        <div className="wizard">
          <aside className="wizardRail">
            <div className="eyebrow" style={{ color: "rgba(248,248,246,0.62)" }}>Recovery first</div>
            <h1>修复语音输入</h1>
            <p>按 Right Command、录音、转写和输入四步检查当前问题。</p>
            <div style={{ marginTop: 20 }}>
              {wizardSteps.map((item, index) => (
                <button
                  className={"stepBtn " + (step === item.id ? "active" : "")}
                  key={item.id}
                  onClick={() => setStep(item.id)}
                >
                  <span className="stepNum">{index + 1}</span>
                  <span className="stepText">
                    <strong>{item.title}</strong>
                    <span>{item.detail}</span>
                  </span>
                </button>
              ))}
            </div>
          </aside>

          <main className="wizardMain">
            <div className="contentHeader">
              <div>
                <div className="eyebrow">Step {activeIndex + 1} of {wizardSteps.length}</div>
                <h1>{wizardSteps[activeIndex].title}</h1>
                <p>{wizardSteps[activeIndex].detail}</p>
              </div>
              <Button tone="accent">运行本步测试</Button>
            </div>

            {step === "command" && (
              <div className="grid2">
                <div className="panel">
                  <div className="panelHeader">
                    <div>
                      <h3>快捷键</h3>
                      <p>Right Command 使用辅助功能权限监听</p>
                    </div>
                    <Pill tone="bad">需要辅助功能</Pill>
                  </div>
                  <div className="panelBody">
                    <div className="commandKey">Right Command</div>
                    <div className="buttonRow" style={{ marginTop: 14 }}>
                      <Button tone="primary">打开辅助功能设置</Button>
                      <Button>改成按住录音</Button>
                    </div>
                  </div>
                </div>
                <PermissionRows />
              </div>
            )}

            {step === "listen" && (
              <div className="grid2">
                <div className="bigPreview"><HudPreview /></div>
                <VoiceSettingsPanel />
              </div>
            )}

            {step === "transcribe" && (
              <div className="grid2">
                <CredentialPanel />
                <div className="panel">
                  <div className="panelHeader">
                    <div>
                      <h3>错误解释</h3>
                      <p>查看 Doubao 返回的错误和建议操作</p>
                    </div>
                    <Pill tone="warn">server response contains no final text</Pill>
                  </div>
                  <div className="panelBody">
                    <p style={{ color: "var(--muted)" }}>如果两次 Command 间隔太短，Voco 会提示录音时间过短或 Doubao 尚未返回最终文本。</p>
                    <div className="buttonRow" style={{ marginTop: 14 }}>
                      <Button tone="accent">测试连接</Button>
                      <Button>查看最近响应</Button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {step === "insert" && (
              <>
                <div className="timeline">
                  {diagnostics.map((item) => (
                    <div className="flowRow" key={item.title}>
                      <SymbolBox label={item.title.slice(0, 3)} tone={item.tone} />
                      <span className="rowCopy">
                        <strong>{item.title}</strong>
                        <span>{item.detail}</span>
                      </span>
                      <Pill tone={item.tone}>{item.state}</Pill>
                    </div>
                  ))}
                </div>
                <div className="buttonRow" style={{ marginTop: 16 }}>
                  <Button tone="primary">在当前输入框测试插入</Button>
                  <Button>切换到 Unicode 事件</Button>
                  <Button>导出诊断包</Button>
                </div>
              </>
            )}
          </main>
        </div>
      </div>
    );
  }

  function App() {
    const [variant, setVariant] = useState(() => localStorage.getItem("voco.prototype.variant") || "workbench");
    const [notice, setNotice] = useState("");

    useEffect(() => {
      localStorage.setItem("voco.prototype.variant", variant);
    }, [variant]);

    useEffect(() => {
      const handler = (event) => {
        setNotice(`${event.detail}：原型中仅展示反馈，真实操作在 native app 中完成`);
        window.clearTimeout(window.__vocoPrototypeNoticeTimer);
        window.__vocoPrototypeNoticeTimer = window.setTimeout(() => setNotice(""), 1800);
      };

      window.addEventListener("voco-prototype-action", handler);
      return () => window.removeEventListener("voco-prototype-action", handler);
    }, []);

    const activeVariant = useMemo(() => {
      if (variant === "compact") return <CompactVariant />;
      if (variant === "recovery") return <RecoveryVariant />;
      return <WorkbenchVariant />;
    }, [variant]);

    return (
      <div className="page">
        <div className="shellTop">
          <div className="brandLockup">
            <div className="appMark">VO</div>
            <div className="brandText">
              <strong>Voco GUI redesign prototype</strong>
              <span>Voco 设置预览</span>
            </div>
          </div>
          <div className="variantSwitch" aria-label="prototype variants">
            {variants.map((item) => (
              <button
                key={item.id}
                className={variant === item.id ? "active" : ""}
                onClick={() => setVariant(item.id)}
              >
                {item.label}
              </button>
            ))}
          </div>
        </div>
        {activeVariant}
        {notice ? <div className="prototypeToast">{notice}</div> : null}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
